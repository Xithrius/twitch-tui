[package]
name = "twitch-tui"
version = "3.0.0-alpha.4"
authors = ["Xithrius <xithrius@gmail.com>"]
edition = "2024"
rust-version = "1.85.0"
description = "Twitch chat in the terminal."
documentation = "https://github.com/Xithrius/twitch-tui"
repository = "https://github.com/Xithrius/twitch-tui"
license = "MIT OR Apache-2.0"
keywords = ["tui", "twitch"]
categories = ["command-line-utilities"]

[dependencies]
tokio = { version = "1.44.2", features = [
    "rt",
    "macros",
    "rt-multi-thread",
    "fs",
] }
tokio-tungstenite = { version = "0.26.2", features = ["native-tls"] }
clap = { version = "4.5.37", features = ["derive", "cargo"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
unicode-width = "0.2.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
unicode-segmentation = "1.12.0"
chrono = { version = "0.4.41", features = ["serde"] }
futures = "0.3.31"
toml = "0.8.22"
textwrap = "0.16.2"
rustyline = "15.0.0"
fuzzy-matcher = "0.3.7"
regex = "1.11.1"
color-eyre = "0.6.3"
dialoguer = { version = "0.11.0", default-features = false, features = [
    "password",
] }
reqwest = { version = "0.12.15", features = ["json"] }
image = "0.25.6"
base64 = "0.22.1"
tempfile = "3.19.1"
serde_with = "3.12.0"
webbrowser = "1.0.4"
memchr = "2.7.4"
bon = "3.8.2"
directories = "6.0.0"

[target.'cfg(not(windows))'.dependencies]
tui = { package = "ratatui", version = "0.30.0", default-features = false, features = [
    "crossterm",
    "serde",
    "underline-color",
] }

[target.'cfg(windows)'.dependencies]
tui = { package = "ratatui", version = "0.30.0", default-features = false, features = [
    "crossterm",
    "serde",
] }

[[bin]]
bench = false
path = "src/main.rs"
name = "twt"

[profile.dev]
lto = "off"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# Don't Panic - prevent panics from unwraps and unsafe slicing or indexing
string_slice = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"
# expect_used = "warn"
# arithmetic_side_effects = "warn"
# exit = "deny"

# Don't Fail Silently - prevent dropped futures and swallowed errors
let_underscore_future = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

# Don't do bad async stuff - prevent deadlocks and concurrency bugs
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
large_futures = "warn"
# only relevant on editions before 2024
# if_let_mutex = "warn"

# Don't do unsafe things with memory
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"

# Don't do potentially incorrect things with numbers
float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
# Change to warn later
cast_sign_loss = "allow"
invalid_upcast_comparisons = "warn"
# Optional - these effectively force you to document numeric invariants
# cast_possible_wrap = "warn"
# Change to warn later
cast_precision_loss = "allow"
# Change to warn later
cast_possible_truncation = "allow"
# as_conversions = "deny"

# Don't do bad things that are easy to avoid
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"

# Don't `allow` your way around these lints - every suppression must be
# a deliberate #[expect(..., reason = "…")] rather than a silent #[allow]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Change to warn later
struct_field_names = "allow"
# Change to deny later
future_not_send = "allow"
